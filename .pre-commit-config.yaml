# Git hooks, run by prek (https://prek.j178.dev). Setup: mise install && prek install.
# CI runs `prek run --all-files`, so every definition here is enforced there too.
#
# Hooks verify and never rewrite files; formatting happens at edit time (scripts/format.sh).
# fail_fast is off, so one run reports everything. Tools run through `mise exec`, so a missing
# tool fails instead of falling back to PATH. See docs/linting-and-hooks.md.

minimum_pre_commit_version: "3.2.0"
fail_fast: false

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

exclude: '^(artifacts/|src/Api/openapi\.json$)'

repos:
  # --- hygiene: built into prek, nearly free ------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
        # By default it only fires mid-merge, and misses markers left after a resolve.
        args: [--assume-in-merge]
      - id: check-case-conflict          # breaks Windows clones, invisible on Linux
      - id: check-json
        # devcontainer.json is JSONC, with comments; dprint checks it instead.
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-yaml
      - id: check-toml
      - id: forbid-submodules
      - id: mixed-line-ending
        args: [--fix=no]                 # check only — .gitattributes owns the fixing
      - id: detect-private-key

  # --- local tools, pinned by .config/mise.toml ---------------------------------------------------
  - repo: local
    hooks:
      # --- secrets -----------------------------------------------------------------------------
      - id: gitleaks
        name: gitleaks (secret scan)
        description: Scans staged changes. Once a secret is pushed, rotation is the only fix.
        entry: mise exec -- gitleaks git --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false

      # --- spelling ----------------------------------------------------------------------------
      - id: typos
        name: typos (spelling)
        entry: mise exec -- typos --force-exclude
        language: system

      # --- whitespace / EOL on the file types dotnet format never sees -------------------------
      - id: editorconfig-checker
        name: editorconfig-checker
        description: Binary is `ec`, not `editorconfig-checker`.
        # IndentSize rejects aligned continuation lines; see docs/linting-and-hooks.md.
        entry: mise exec -- ec -disable-indent-size
        language: system

      # --- GitHub Actions, including the inline bash in ci.yml ---------------------------------
      - id: actionlint
        name: actionlint (workflows)
        entry: mise exec -- actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      # --- shell -------------------------------------------------------------------------------
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        files: \.sh$

      # --- formatting: verify only; scripts/format.sh fixes. dotnet format loads the whole
      # workspace, too slow for every commit, so it runs on pre-push.
      - id: dprint-check
        name: dprint (markdown, json)
        description: Verifies only. Fix with scripts/format.sh
        entry: mise exec -- dprint check
        language: system
        files: \.(md|json)$

  # --- commit-msg ---------------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: committed
        name: committed (conventional commits)
        entry: mise exec -- committed --commit-file
        language: system
        stages: [commit-msg]
        always_run: true

  # --- pre-push: slower, whole repo ---------------------------------------------------------------
  - repo: local
    hooks:
      - id: build
        name: dotnet build (warnings are errors)
        entry: dotnet build --nologo
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: test
        name: dotnet test
        # Not `dotnet test --nologo`: this runner then matches zero test modules, which looks like
        # a pass.
        entry: dotnet test
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: openapi-drift
        name: openapi.json is current
        entry: scripts/check-openapi-drift.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: dotnet-format-check
        name: dotnet format (whole solution)
        description: Verifies only. Fix with scripts/format.sh
        entry: dotnet format ModernDotnetTemplate.slnx --verify-no-changes
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: lychee
        name: lychee (link check)
        entry: mise exec -- lychee --no-progress
        language: system
        stages: [pre-push]
        files: \.md$
