name: AI review

# Runs the slice-reviewer agent on a PR when it gets the `ai-review` label. On demand rather than
# on every push, because each run spends usage. Needs a CLAUDE_CODE_OAUTH_TOKEN secret, from
# `claude setup-token` (subscription usage); swap in `anthropic_api_key` to pay per run instead.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  review:
    name: Slice review
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Comments as github-actions, so the Claude GitHub App isn't needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} is
            checked out. Find the slices under src/Api/Features/ it changes with `gh pr diff`, and
            run the slice-reviewer agent on each. Post its findings as inline comments where they
            point at a line, and one `gh pr comment` summary. If no slice changed, say so in that
            comment.
          claude_args: >-
            --allowedTools "Agent,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
