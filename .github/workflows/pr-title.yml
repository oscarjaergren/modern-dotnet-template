name: PR title

# Squash merging makes the PR title the commit on main, and the commit-msg hook never sees it.
# Check it with the same committed.toml. `edited` reruns this on a title change, `synchronize` keeps
# the required check present on every new head commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup lint toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # The title arrives through env, never interpolated into the script, so it cannot inject.
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          mise exec -- committed --commit-file "$RUNNER_TEMP/title"
