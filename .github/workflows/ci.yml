name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Jobs that need more request it explicitly.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, test, format, contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # So a commit made with --no-verify still cannot ship past the hooks.
      - name: Setup lint toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Lint (prek, all files)
        run: prek run --all-files --show-diff-on-failure

      - name: Restore
        run: dotnet restore

      # Warnings are errors, and NuGet audit findings fail the build. See docs/build-gates.md.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # No --nologo: this test runner then matches zero modules and passes (see .pre-commit-config).
      # No container runtime is needed until a database is added.
      - name: Test
        run: dotnet test --no-build --configuration Release -- --coverage --coverage-output-format cobertura

      # Merges the three per-project reports, which each understate alone, and drops generated code.
      # Reported, never gated. An action, not a local tool: a second tool in dotnet-tools.json
      # breaks `dotnet tool restore` on fresh machines (dotnet/sdk#53783).
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        with:
          reports: TestResults/*.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub
          classfilters: -Microsoft.*
          verbosity: Warning

      - name: Publish coverage summary
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      # lychee is a pre-push hook, which `prek run --all-files` skips; without this step
      # `git push --no-verify` could ship broken links.
      - name: Check links
        run: prek run lychee --all-files --hook-stage pre-push

      - name: Verify OpenAPI contract is current
        run: scripts/check-openapi-drift.sh

  secret-scan:
    name: Secrets (full history)
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit hook only scans staged changes, so it sees nothing here, and a
      # secret committed then deleted still needs rotating.
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup lint toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Scan history for secrets
        run: mise exec -- gitleaks git --redact --no-banner --verbose

  aot-container:
    name: Native AOT and container
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=docker depName=schemathesis/schemathesis
      SCHEMATHESIS_VERSION: v4.28.0-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Native AOT shells out to clang and the system linker on Linux.
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Any trim or AOT warning fails this (Directory.Build.props).
      - name: Publish container image
        run: dotnet publish src/Api/Api.csproj -c Release -r linux-x64 /t:PublishContainer

      - name: Start the image
        run: |
          echo "CID=$(docker run -d -p 8080:8080 api:latest)" >> "$GITHUB_ENV"
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 --retry-connrefused -o /dev/null \
            http://127.0.0.1:8080/alive

      # A clean AOT publish proves little; failures show at runtime. Run it.
      - name: Verify the image serves traffic
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/ping | tee /dev/stderr | grep -q '"status":"pong"'

          curl -fsS -X POST http://127.0.0.1:8080/greetings \
            -H 'Content-Type: application/json' -d '{"name":"Ada","age":36}' \
            | tee /dev/stderr | grep -q 'Hello, Ada'

          # A 409 with a traceId also proves ProblemDetails serialises under AOT.
          conflict=$(curl -s -o /tmp/conflict.json -w '%{http_code}' -X POST http://127.0.0.1:8080/greetings \
            -H 'Content-Type: application/json' -d '{"name":"admin"}')
          if [ "$conflict" != "409" ]; then
            echo "::error::Expected 409 for a reserved name, got $conflict."
            exit 1
          fi
          grep -q '"traceId"' /tmp/conflict.json || {
            echo "::error::ProblemDetails response is missing traceId — log correlation is broken."
            exit 1
          }

          # Probes must answer in Production, where the Aspire default leaves them unmapped.
          for probe in /alive /health; do
            body=$(curl -fsS "http://127.0.0.1:8080$probe")
            [ "$body" = "Healthy" ] || {
              echo "::error::$probe returned '$body', expected exactly 'Healthy'."
              echo "::error::A body with more than the aggregate status leaks the check list."
              exit 1
            }
          done

          # Keeps the README's size claim honest, and catches AOT symbols leaking into the image.
          # Gzipped, so it measures compressed size whichever Docker image store the runner uses.
          bytes=$(docker save api:latest | gzip -c | wc -c)
          awk -v b="$bytes" 'BEGIN { printf "Image size (compressed): %.1f MB\n", b / 1048576 }'
          if [ "$bytes" -gt 20971520 ]; then
            echo "::error::Image is over the 20 MB compressed ceiling. Something large got into a layer."
            exit 1
          fi

      # Generated requests, every response checked against the committed openapi.json: 500s,
      # undocumented statuses, wrong bodies, and invalid input accepted (validation not running).
      # positive_data_acceptance is off: System.Text.Json rejects 14.0 for an int, which JSON
      # Schema counts as an integer (dotnet/runtime#40596).
      - name: Fuzz the API against its contract
        run: |
          docker run --rm --network host -v "$PWD/src/Api/openapi.json:/openapi.json:ro" \
            "schemathesis/schemathesis:$SCHEMATHESIS_VERSION" \
            run /openapi.json --url http://127.0.0.1:8080 --exclude-checks positive_data_acceptance

      - name: Container logs
        if: always() && env.CID != ''
        run: docker logs "$CID"
