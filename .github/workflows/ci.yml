name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Jobs that need more request it explicitly.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build, test, format, contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # The identical hook definitions developers run locally. A check added to
      # .pre-commit-config.yaml is enforced here automatically, and `git commit --no-verify`
      # cannot ship past it. See docs/linting-and-hooks.md.
      - name: Setup lint toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Lint (prek, all files)
        run: prek run --all-files --show-diff-on-failure

      - name: Restore
        run: dotnet restore

      # Warnings are errors, and NuGet audit findings fail the build. See docs/build-gates.md.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit, architecture, and Aspire integration tests. No container runtime is required:
      # the AppHost has only a project resource. Adding a database changes that —
      # see docs/adding-a-database.md.
      # Local tools: ReportGenerator merges and summarises the coverage reports below.
      - name: Restore tools
        run: dotnet tool restore

      # NOT `dotnet test --nologo`. The Microsoft.Testing.Platform runner rejects that flag by
      # silently matching zero test modules, reports "Zero tests ran", and exits in a way that
      # looks like a pass. See .pre-commit-config.yaml.
      - name: Test
        run: dotnet test --no-build --configuration Release -- --coverage --coverage-output-format cobertura

      # Each test project writes its own report over the same assemblies, so a single file reads
      # far lower than reality — the unit tests alone "cover" 2% of Api. ReportGenerator merges
      # all three. classfilters drops source-generated code (routing, OpenAPI, validation), which
      # is not code anyone here wrote or can test directly.
      #
      # Reported, never gated: a percentage measures which lines a test touched, not whether it
      # asserted anything, and the cheapest way to raise it is a test that asserts nothing.
      - name: Coverage report
        run: |
          set -euo pipefail
          dotnet tool run reportgenerator \
            -reports:"TestResults/*.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"MarkdownSummaryGithub;Cobertura" \
            -classfilters:"-Microsoft.*" \
            -verbosity:Warning
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      # lychee runs at the pre-push stage locally, and `prek run --all-files` above only runs the
      # pre-commit stage — so without this, `git push --no-verify` would skip link checking and
      # nothing downstream would ever catch a broken link. Invoked through prek so the hook
      # definition stays the single source of truth.
      - name: Check links
        run: prek run lychee --all-files --hook-stage pre-push

      # NuGet audit (NU1903, a build error here) covers direct and centrally-pinned packages.
      # This walks the full transitive graph, which audit does not.
      - name: Scan transitive dependencies for advisories
        run: |
          set -euo pipefail
          out=$(dotnet list package --vulnerable --include-transitive)
          echo "$out"
          if grep -qiE "has the following vulnerable packages" <<<"$out"; then
            echo "::error::Vulnerable transitive package(s) found. Pin a fixed version in Directory.Packages.props."
            exit 1
          fi

      # The committed OpenAPI document is the API contract. A build regenerates it; if that
      # produces a different file, the contract changed without being reviewed.
      - name: Verify OpenAPI contract is current
        run: |
          if ! git diff --exit-code -- src/Api/openapi.json; then
            echo "::error file=src/Api/openapi.json::openapi.json is out of date. Run 'dotnet build' and commit the result."
            exit 1
          fi

  secret-scan:
    name: Secrets (full history)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is the point of this job. The pre-commit hook runs `gitleaks git --staged`,
      # which scans a staged diff and therefore scans nothing in CI, where nothing is staged.
      # Without a history scan the secret gate would be enforced only on machines that happen to
      # have the hook installed.
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup lint toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # Scans every commit, not just the tip: a secret that was committed and later deleted still
      # needs rotating, and only history says so.
      - name: Scan history for secrets
        run: mise exec -- gitleaks git --redact --no-banner --verbose

  aot-container:
    name: Native AOT and container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # Native AOT shells out to clang and the system linker on Linux.
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # This is the gate that keeps the AOT claim true as the template evolves: any trim or
      # AOT warning is an error via Directory.Build.props. See docs/native-aot.md.
      - name: Publish container image
        run: dotnet publish src/Api/Api.csproj -c Release -r linux-x64 /t:PublishContainer

      # Publishing successfully proves nothing — AOT failures surface at runtime. Actually run it.
      - name: Verify the image serves traffic
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 8080:8080 modern-dotnet-template-api:latest)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8080/ping | tee /dev/stderr | grep -q '"status":"pong"'

          curl -fsS -X POST http://127.0.0.1:8080/greetings \
            -H 'Content-Type: application/json' -d '{"name":"Ada","age":36}' \
            | tee /dev/stderr | grep -q 'Hello, Ada'

          # Validation must reject bad input. This asserts the .NET 10 validation source generator
          # is actually wired up — it fails silently with a 200 when it is not. See AGENTS.md.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/greetings \
            -H 'Content-Type: application/json' -d '{"name":"","age":500}')
          if [ "$code" != "400" ]; then
            echo "::error::Expected 400 from validation, got $code — validation is not running."
            exit 1
          fi

          # An expected failure returned as a value, not thrown. Also proves ProblemDetails
          # serializes under Native AOT, which needs an ApiJsonSerializerContext entry and would
          # otherwise fail at runtime rather than at build. See docs/errors-and-failures.md.
          conflict=$(curl -s -o /tmp/conflict.json -w '%{http_code}' -X POST http://127.0.0.1:8080/greetings \
            -H 'Content-Type: application/json' -d '{"name":"admin"}')
          if [ "$conflict" != "409" ]; then
            echo "::error::Expected 409 for a reserved name, got $conflict."
            exit 1
          fi
          grep -q '"traceId"' /tmp/conflict.json || {
            echo "::error::ProblemDetails response is missing traceId — log correlation is broken."
            exit 1
          }

          # Probes are mapped in every environment, and this container runs in Production —
          # which is the environment where the Aspire default would have left them unmapped.
          # See src/ServiceDefaults/Extensions.cs.
          for probe in /alive /health; do
            body=$(curl -fsS "http://127.0.0.1:8080$probe")
            [ "$body" = "Healthy" ] || {
              echo "::error::$probe returned '$body', expected exactly 'Healthy'."
              echo "::error::A body with more than the aggregate status leaks the check list."
              exit 1
            }
          done

          # The README quotes an image size, and this is what keeps it true. It also guards a
          # regression that already happened once: AOT symbols copied into the image added 48 MB.
          # See src/Api/Api.csproj.
          #
          # Piped through gzip on purpose. What `docker save` emits depends on the daemon's image
          # store: the containerd store writes compressed layers (~15 MB here), the classic store
          # writes them uncompressed (~48 MB). Gzipping the stream measures compressed size — the
          # size a registry actually serves — whichever store the runner has.
          bytes=$(docker save modern-dotnet-template-api:latest | gzip -c | wc -c)
          awk -v b="$bytes" 'BEGIN { printf "Image size (compressed): %.1f MB\n", b / 1048576 }'
          if [ "$bytes" -gt 20971520 ]; then
            echo "::error::Image is over the 20 MB compressed ceiling. Something large got into a layer."
            exit 1
          fi

      # Symbols are deliberately excluded from the image; keep them for post-mortem symbolication.
      - name: Upload debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-debug-symbols
          path: artifacts/bin/Api/release_linux-x64/native/Api.dbg
          if-no-files-found: error
          retention-days: 14
