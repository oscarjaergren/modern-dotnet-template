name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Jobs that need more request it explicitly.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, test, format, contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      # So a commit made with --no-verify still cannot ship past the hooks.
      - name: Setup lint toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Lint (prek, all files)
        run: mise run lint

      - name: Restore
        run: dotnet restore

      # Warnings are errors, and NuGet audit findings fail the build. See docs/build-gates.md.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # No --nologo: this test runner then matches zero modules and passes (see .pre-commit-config).
      # No container runtime is needed until a database is added.
      - name: Test
        run: dotnet test --no-build --configuration Release -- --coverage --coverage-output-format cobertura

      # Merges the three per-project reports, which each understate alone, and drops generated code.
      # Reported, never gated. An action, not a local tool: a second tool in dotnet-tools.json
      # breaks `dotnet tool restore` on fresh machines (dotnet/sdk#53783).
      - name: Coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        with:
          reports: TestResults/*.cobertura.xml
          targetdir: coverage
          reporttypes: MarkdownSummaryGithub
          classfilters: -Microsoft.*
          verbosity: Warning

      - name: Publish coverage summary
        run: cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      # lychee is a pre-push hook, which `prek run --all-files` skips; without this step
      # `git push --no-verify` could ship broken links.
      - name: Check links
        run: prek run lychee --all-files --hook-stage pre-push

      - name: Verify OpenAPI contract is current
        run: mise run openapi-check

      # The commands AGENTS.md gives agents for running the app. Traces appear a few seconds after
      # the request, once exported.
      - name: Agent run loop
        run: |
          mise run start
          trap 'mise run stop' EXIT
          url=$(mise run --quiet url)
          curl -fsS "$url/ping"
          mise run rebuild
          curl -fsS "$url/ping"
          for _ in $(seq 30); do mise run --quiet traces > /dev/null 2>&1 && break; sleep 1; done
          mise run --quiet traces | jq -e 'length > 0' > /dev/null
          mise run --quiet logs -n 5 | jq -e '.logs | length > 0' > /dev/null

  secret-scan:
    name: Secrets (full history)
    runs-on: ubuntu-latest
    steps:
      # Full history: the commit hook only scans staged changes, so it sees nothing here, and a
      # secret committed then deleted still needs rotating.
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup lint toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Scan history for secrets
        run: mise exec -- gitleaks git --redact --no-banner --verbose

  aot-container:
    name: Native AOT and container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Setup toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # Native AOT shells out to clang and the system linker on Linux.
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Any trim or AOT warning fails this (Directory.Build.props).
      - name: Publish container image
        run: mise run image

      # Endpoints, probes, size ceiling, the README's size claim, then fuzzing against openapi.json.
      - name: Check the image
        run: mise run image-check

  mutation:
    name: Mutation testing (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: --since diffs against origin/main.
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Setup toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      # See docs/build-gates.md: why 80, and why endpoints and Program.cs are left out.
      - name: Mutation test the changed code
        run: mise run mutate

      - name: Publish mutation report
        if: always()
        run: |
          report=artifacts/stryker/reports/mutation-report.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
