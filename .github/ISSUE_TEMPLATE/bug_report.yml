name: Bug report
description: Something in the template does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If the problem is a gate failing on code you believe is correct,
        please include the exact build output — that is usually the fastest route to a fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps from a fresh clone, ideally the exact commands.
      placeholder: |
        1. git clone ...
        2. dotnet build
        3. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant build, test, or runtime output. Paste as text, not a screenshot.
      render: shell

  - type: input
    id: dotnet-version
    attributes:
      label: dotnet --version
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04 x64 / macOS 15 arm64 / Windows 11 x64
    validations:
      required: true
