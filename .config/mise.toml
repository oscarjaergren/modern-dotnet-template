# Pinned versions of every tool the git hooks run. The devcontainer and CI install from this
# file too, so every machine runs identical binaries. The .NET SDK is pinned by global.json.
#
# Setup: mise install && prek install. Updates: Renovate, or `mise outdated`.

[tools]
prek = "0.4.14"                  # git hook manager
gitleaks = "8.30.1"              # secret scanning
typos = "1.49.0"                 # spelling
editorconfig-checker = "3.11.1"  # .editorconfig compliance for non-C# files
actionlint = "1.7.12"            # GitHub Actions workflows
shellcheck = "0.11.0"            # shell scripts, and actionlint's inline-bash checks
dprint = "0.56.0"                # markdown + json formatting
jq = "1.8.1"                     # reads the agent hook's JSON payload
lychee = "0.24.2"                # link checking (pre-push: network-bound)
committed = "1.1.11"             # conventional commit messages

[settings]
# Fail rather than silently using whatever happens to be on PATH.
lockfile = true
